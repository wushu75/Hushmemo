<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HushMemo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>HushMemo</title>
  <!-- app tile -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#2F7D6B"/>
  <!-- a note, jotted at a slight angle -->
  <g transform="rotate(-5 24 24)">
    <rect x="13" y="9" width="22" height="30" rx="3" fill="#FBFBFA"/>
    <line x1="17" y1="17" x2="31" y2="17" stroke="#AEB8B2" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="22" x2="31" y2="22" stroke="#AEB8B2" stroke-width="2" stroke-linecap="round"/>
    <!-- the line being written, and the quiet 'listening' dot at its tip -->
    <line x1="17" y1="27" x2="27" y2="27" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="31" cy="27" r="2.4" fill="#2F7D6B"/>
  </g>
</svg>
